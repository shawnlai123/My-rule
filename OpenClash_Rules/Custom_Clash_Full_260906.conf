[General]
# Custom_OpenClash_Rules
# OpenClash 远程 YAML 覆写模块（重度分流版）
# 对应配置：cfg/yaml/Custom_Clash_Full.yaml
# 模块变量：EN_KEY1=节点订阅链接

DOWNLOAD_FILE = url=https://raw.githubusercontent.com/shawnlai123/My-rule/refs/heads/main/OpenClash_Rules/Custom_Clash_Full_260906.yaml, path=/etc/openclash/config/Custom_Clash_Full_260906.yaml, force=true
CONFIG_FILE = /etc/openclash/config/Custom_Clash_Full_260906.yaml
SUB_INFO_URL = $EN_KEY1
RESTART = true

[Overwrite]
ruby_map_edit "$CONFIG_FILE" "['proxy-providers']" "provider1" "['url']" "$EN_KEY1"
